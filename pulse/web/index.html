<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульс</title>
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Пульс">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M5 17h6l3-8 4 15 3-7h6' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Разделы">
      <div class="brand">Пульс</div>
      <a href="#today" data-view="today" data-icon="today">Сегодня</a>
      <a href="#tasks" data-view="tasks" data-icon="task">Дела</a>
      <a href="#feed" data-view="feed" data-icon="feed">Лента</a>
      <a href="#analytics" data-view="analytics" data-icon="chart">Аналитика</a>
      <a href="#settings" data-view="settings" data-icon="sliders">Настройки</a>
      <button id="theme" class="rail-theme" type="button" aria-label="Сменить тему" data-icon="moon"></button>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <button id="ask-open" class="ask-fab" type="button" data-icon="spark">Спросить</button>
  <section id="ask-panel" class="ask-panel" aria-label="Вопросы локальной модели" hidden>
    <header id="ask-head" class="ask-head" title="Перетащите, чтобы подвинуть">
      <span class="ask-title">Спросить</span>
      <span class="private" data-icon="shield" title="Вопрос и ответ не покидают компьютер и нигде не хранятся">локально</span>
      <button id="ask-clear" class="ask-link" type="button">Очистить</button>
      <button id="ask-close" class="tool" type="button" aria-label="Закрыть" data-icon="close"></button>
    </header>
    <div id="ask-log" class="ask-log"></div>
    <form id="ask-form" class="ask-form">
      <input id="ask-input" autocomplete="off" aria-label="Вопрос локальной модели" placeholder="Спросить о чатах и делах">
      <button class="tool" type="submit" aria-label="Отправить" data-icon="up"></button>
    </form>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
